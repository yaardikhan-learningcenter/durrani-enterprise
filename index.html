<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Durrani ERP</title><style>:root{
  --ink:#12263a; --ink2:#1d3a52; --muted:#5b6b7a; --line:#dde3e9; --bg:#f3f5f7; --card:#fff;
  --teal:#0f766e; --teal-soft:#d7efec; --flame:#e8590c; --flame-soft:#fde6d8; --blue:#2563eb; --blue-soft:#dbe7fd;
  --good:#15803d; --bad:#b91c1c; --warn:#b45309;
  --side:#10202f; --side-text:#b9c6d2; --side-act:#1c3a52;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100%}
.sidebar{background:var(--side);color:var(--side-text);overflow-y:auto;display:flex;flex-direction:column;padding:14px 10px 18px}
.brand{padding:6px 10px 14px;border-bottom:1px solid #26405a;margin-bottom:8px}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:.2px}
.brand span{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:#7f95a8}
.nav-h{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#6d8499;padding:14px 10px 4px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;color:var(--side-text);text-decoration:none;cursor:pointer}
.nav a:hover{background:#17304a;color:#fff}
.nav a.on{background:var(--side-act);color:#fff;box-shadow:inset 3px 0 0 var(--flame)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:#6d8499}
.main{overflow:auto;padding:0 24px 40px;min-width:0}
.topbar{display:none}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 0 12px}
.page-h h1{margin:0;font-size:22px}
.page-h p{margin:2px 0 0;color:var(--muted)}
.pbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.pbar .lbl{font-weight:600;margin-left:4px}
.pbar .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:#b9c4cf;background:#f8fafb}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:#0b625b}
.btn.dng{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
input,select,textarea{border:1px solid #c9d2db;border-radius:7px;padding:7px 9px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:14.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .k{font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:650;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.sale .v{color:var(--teal)} .kpi.pur .v{color:var(--blue)} .kpi.exp .v{color:var(--flame)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.chart{position:relative;height:270px}
.chart.sm{height:230px}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%}
.tbl th{background:#eef2f5;text-align:left;font-size:12px;letter-spacing:.3px;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 9px;border-bottom:1px solid #eef1f4;vertical-align:top}
.tbl tr.tot td{font-weight:700;background:#f6f8fa;border-top:2px solid var(--ink)}
.tbl tr.sub td{background:#fafbfc;color:var(--muted)}
.tbl .n{text-align:right;white-space:nowrap}
.tbl .c{text-align:center}
.tbl tbody tr:hover td{background:#f7fafc}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:600}
.tag.in{background:var(--teal-soft);color:#0b5a54}.tag.out{background:var(--flame-soft);color:#9a3a07}.tag.tr{background:var(--blue-soft);color:#1e4bb0}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.form label input,.form label select,.form label textarea{font-weight:400;color:var(--ink);font-size:14px}
.form .wide{grid-column:span 2}
.form .full{grid-column:1/-1}
.inl{display:flex;gap:6px}.inl select{flex:1}
.calc{background:#f4f8f8;border:1px dashed #9fc7c3;border-radius:9px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px}
.calc div span{display:block;font-size:11.5px;color:var(--muted)}
.calc div b{font-size:16px}
.row-actions{display:flex;gap:6px;white-space:nowrap}
.note{background:#fff7ed;border:1px solid #f6d3b0;color:#7a3a0a;border-radius:9px;padding:10px 14px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.brandlogo{margin:16px 0 0}.brandlogo img{height:50px;max-width:100%}
.brand-logo{padding:0;margin-bottom:8px;text-align:left}.brand-logo img{display:block;width:120px;max-width:100%;height:auto}
@media print{.brand-logo{display:none}}
.print-head{position:relative;display:none;text-align:center;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.print-head .phlogo{position:absolute;left:0;top:0;width:120px;height:auto}.print-head h2{margin:0;font-size:20px}.print-head div{font-size:12px}
.print-head .rt{font-size:15px;font-weight:700;margin-top:6px}
.modal-wrap{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-h .sp{flex:1}
.modal-b{padding:16px;overflow:auto}
/* documents */
.doc{background:#fff;color:#000;font-family:"Segoe UI",Arial,sans-serif;font-size:13px}
.inv{width:780px;max-width:100%;padding:18px 22px;border:1px solid #000;margin:0 auto}
.inv h2{margin:0;text-align:center;font-size:24px;letter-spacing:.5px}
.inv .c{text-align:center}
.inv table{width:100%;border-collapse:collapse}
.inv th,.inv td{border:1px solid #000;padding:5px 7px}
.inv th{background:#e9edf0;font-size:12px}
.inv .n{text-align:right}
.inv .meta td{border:0;padding:2px 4px}
.inv .ttl{font-size:17px;font-weight:700;text-align:center;border:1px solid #000;padding:5px;margin:10px 0;letter-spacing:2px}
.inv .tots{margin-left:auto;width:60%;margin-top:8px}
.inv .tots td{padding:4px 7px}
.inv .sign{display:flex;justify-content:space-between;margin-top:50px;font-size:12px}
.inv .sign div{border-top:1px solid #000;padding-top:4px;min-width:170px;text-align:center}
.rcp{width:380px;max-width:100%;padding:14px 16px;border:1px dashed #000;margin:0 auto}
.rcp h3{margin:0;text-align:center;font-size:18px}
.rcp .c{text-align:center;font-size:11.5px}
.rcp table{width:100%;border-collapse:collapse;margin:6px 0}
.rcp th,.rcp td{padding:3px 2px;border-bottom:1px dotted #555;font-size:12.5px;text-align:left}
.rcp .n{text-align:right}
.rcp .big td{font-weight:700;font-size:14px;border-bottom:0}
.rcp .t{font-weight:700;text-align:center;letter-spacing:2px;margin:8px 0 4px;border-top:1px solid #000;border-bottom:1px solid #000;padding:3px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--side);color:#fff;padding:10px 14px}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .sidebar{transform:none}
  .main{padding:0 14px 30px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .form .wide{grid-column:auto}
}
@media print{
  @page{size:A4;margin:11mm}
  html,body,.app,.main{height:auto!important;overflow:visible!important;background:#fff!important}
  .app{display:block}
  .sidebar,.topbar,.noprint,.pbar,.row-actions{display:none!important}
  .main{padding:0}
  .print-head{display:block}
  .card,.kpi{box-shadow:none;break-inside:avoid;border-color:#bbb}
  .grid{gap:8px}.kpis{gap:8px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .chart,.chartgrid{display:none!important}
  .card.brk{break-inside:auto}
  .card.brk .tbl tr,.card.brk table tr{break-inside:avoid}
  .card.brk thead{display:table-header-group}
  .card.brk td:nth-child(2){white-space:nowrap}
  .dbtx td:nth-child(1),.dbtx td:nth-child(6){white-space:nowrap}
  .dbtx td{padding:3px 6px!important;font-size:11px;white-space:nowrap}
  .dbtx th{padding:5px 6px;font-size:11px}
  .dbtx tfoot{display:table-row-group}
  .dbtx h3{break-after:avoid}
  .dbtx{break-before:auto}
  .sumgrid{grid-template-columns:1fr!important}
  .card:has(> h3 + .chart){display:none!important}
  .tbl-wrap{overflow:visible}
  .tbl th{background:#e9edf0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.modal-open .app{display:none!important}
  body.modal-open .modal-wrap{position:static;background:none;padding:0;display:block;overflow:visible}
  body.modal-open .modal{box-shadow:none;border-radius:0}
  body.modal-open .modal-h{display:none}
  body.modal-open .modal-b{padding:0}
  .inv,.rcp{margin:0 auto}
  .inv th{background:#e9edf0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

#loginGate{position:fixed;inset:0;z-index:9999;background:#0f2233;display:flex;align-items:center;justify-content:center;padding:16px}
#loginGate .box{background:#fff;border-radius:12px;padding:28px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#loginGate h2{margin:0 0 4px;font-size:20px}#loginGate p{margin:0 0 16px;color:#667;font-size:13px}
#loginGate label{display:block;font-size:12.5px;margin-bottom:12px}
#loginGate input{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid #ccd;border-radius:6px;font-size:15px}
#loginGate button{width:100%;padding:11px;border:0;border-radius:6px;background:#0b6bcb;color:#fff;font-size:15px;cursor:pointer}
#loginErr{color:#c0262d;font-size:13px;min-height:18px;margin-top:10px}
</style></head>
<body>
<div class="app">
<div id="loginGate"><form class="box" id="loginForm"><h2>Durrani Enterprises</h2><p>LPG ERP &mdash; please sign in</p><label>Email<input id="lgEmail" type="email" autocomplete="username" required></label><label>Password<input id="lgPass" type="password" autocomplete="current-password" required></label><button type="submit" id="lgBtn">Sign in</button><div id="loginErr"></div></form></div>
<aside class="sidebar"><div class="brand"><div class="brand-logo"><img id="sideLogo" alt="Durrani Enterprises"></div><b>Durrani Enterprises</b><span>LPG ERP</span></div><nav class="nav" id="nav"></nav><div class="side-foot"><div id="whoami" style="margin-bottom:8px;word-break:break-all"></div><button class="btn" id="logoutBtn" style="width:100%">Log out</button><div id="syncState" style="margin-top:8px"></div></div></aside>
<div style="display:flex;flex-direction:column;min-width:0;height:100%"><div class="topbar"><button class="btn sm" id="burger" aria-label="Menu">&#9776; Menu</button><b>Durrani ERP</b></div><main class="main" id="view" style="flex:1;min-height:0"></main></div>
</div>

}
function groupMode() {

  if (PER.type === 'day') return 'day';

}
const bkey = (s, m) => m === 'day' ? s : m === 'week' ? weekStart(s) : m === 'month' ? s.slice(0, 7) : s.slice(0, 4);
function blabel(k, m) {
  if (m === 'day') { const d = parse(k); return `${pad(d.getDate())} ${MON[d.getMonth()]}`; }
  if (m === 'week') return 'W ' + fd(k).slice(0, 6);

}
function blong(k, m) { return m === 'day' ? fd(k) : m === 'week' ? `Week of ${fd(k)}` : m === 'month' ? `${MONL[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}` : 'Year ' + k; }

    let y = a.getFullYear(), mo = m === 'month' ? a.getMonth() : 0;
    for (let g = 0; g < 2000; g++) {

const inR = (d, f, t) => d >= f && d <= t;

/* ---------- costing (weighted average) ---------- */
function costing() {
  const st = S(); const cost = {}; const q = { A: 0, B: 0 }, val = { A: 0, B: 0 }, last = { A: st.openCost.A || 0, B: st.openCost.B || 0 };
  for (const c of Object.values(st.openStock)) { q.A += +c.A || 0; q.B += +c.B || 0; }
  val.A = q.A * (st.openCost.A || 0); val.B = q.B * (st.openCost.B || 0);
  const ev = [];
  DB.purchases.forEach(p => ev.push({ d: p.date, o: 0, id: p.id, p }));
  DB.sales.forEach(s => ev.push({ d: s.date, o: 1, id: s.id, s }));
  ev.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.o - b.o || a.id - b.id);
  for (const e of ev) {
    if (e.p) {
      const c = calcPur(e.p);
      q.A += +e.p.qA || 0; val.A += c.A.excl; q.B += +e.p.qB || 0; val.B += c.B.excl;
      if (q.A > 0) last.A = val.A / q.A; if (q.B > 0) last.B = val.B / q.B;
    } else {
      let tot = 0;
      for (const z of ['A', 'B']) {
        const n = +e.s['q' + z] || 0; if (!n) continue;
        const avg = q[z] > 0 ? val[z] / q[z] : last[z];
        const cst = n * avg; tot += cst; q[z] -= n; val[z] -= cst; if (q[z] <= 0) val[z] = 0;
      }
      cost[e.id] = tot;
    }
  }
  return cost;
}

function acctTxns() {

  for (const r of DB.payments) t.push({ date: r.date, id: r.id, kind: 'Payment', acct: r.acct, party: supName(r.party), desc: (r.purId ? 'Paid with purchase' : 'Supplier payment') + (r.note ? ' - ' + r.note : ''), ref: r.no, inn: 0, out: +r.amt });
  for (const r of DB.expenses) t.push({ date: r.date, id: r.id, kind: 'Expense', acct: r.acct, party: r.name, desc: r.note || 'Expense', ref: 'EXP-' + r.id, inn: 0, out: +r.amt });
  for (const r of DB.transfers) {

  let b = +acct.opening || 0;

/* ---------- party balances ---------- */
function partyBal(kind, id, to = '9999-12-31') {
  const p = byId(kind === 'c' ? DB.customers : DB.suppliers, id); let b = +p?.opening || 0;
  if (kind === 'c') { DB.sales.forEach(s => { if (s.cust === id && s.date <= to) b += s.total; }); DB.receipts.forEach(r => { if (r.party === id && r.date <= to) b -= r.amt; }); }
  else { DB.purchases.forEach(s => { if (s.sup === id && s.date <= to) b += s.total; }); DB.payments.forEach(r => { if (r.party === id && r.date <= to) b -= r.amt; }); }
  return b;
}

/* ---------- metrics for a range ---------- */
function metrics(f, t) {

    m.sale += s.total; m.tax += s.st; m.itax += s.itax; m.conc += s.conc || 0; m.cogs += cost[s.id] || 0; m.qSA += +s.qA || 0; m.qSB += +s.qB || 0;

  }
  for (const p of DB.purchases) if (inR(p.date, f, t)) { m.pur += p.total; m.purTax += p.st || 0; m.qPA += +p.qA || 0; m.qPB += +p.qB || 0; }
  for (const e of DB.expenses) if (inR(e.date, f, t)) { m.exp += +e.amt; const k = (e.name || 'Other').trim().toUpperCase(); m.expBy[k] = (m.expBy[k] || 0) + +e.amt; }

  for (const r of DB.payments) if (inR(r.date, f, t)) m.pay += +r.amt;
  m.rev = m.sale - m.tax - m.itax; m.gross = m.rev - m.cogs; m.profit = m.gross - m.exp;

}
function stockCalc(f, t) {
  const st = S(); const rows = {};
  const get = c => rows[c] ||= { comp: c || 'General', oA: 0, oB: 0, pA: 0, pB: 0, sA: 0, sB: 0 };
  for (const c of DB.companies) get(c);
  for (const [c, v] of Object.entries(st.openStock)) { const r = get(c); r.oA += +v.A || 0; r.oB += +v.B || 0; }
  for (const p of DB.purchases) { const r = get(p.comp); if (p.date < f) { r.oA += +p.qA || 0; r.oB += +p.qB || 0; } else if (p.date <= t) { r.pA += +p.qA || 0; r.pB += +p.qB || 0; } }
  for (const s of DB.sales) { const r = get(s.comp); if (s.date < f) { r.oA -= +s.qA || 0; r.oB -= +s.qB || 0; } else if (s.date <= t) { r.sA += +s.qA || 0; r.sB += +s.qB || 0; } }
  const list = Object.values(rows).map(r => ({ ...r, cA: r.oA + r.pA - r.sA, cB: r.oB + r.pB - r.sB }));

  return { list, tot };
}

function seriesBy(f, t, mode) {
  const keys = bucketKeys(f, t, mode), idx = Object.fromEntries(keys.map((k, i) => [k, i]));
  const z = () => keys.map(() => 0); const cost = costing();
  const S_ = { keys, sale: z(), pur: z(), exp: z(), cogs: z(), tax: z(), rev: z(), recIn: z(), out: z(), qsA: z(), qsB: z(), qpA: z(), qpB: z() };
  const at = d => idx[bkey(d, mode)];
  DB.sales.forEach(s => { if (inR(s.date, f, t)) { const i = at(s.date); S_.sale[i] += s.total; S_.tax[i] += s.st + s.itax; S_.cogs[i] += cost[s.id] || 0; S_.qsA[i] += +s.qA || 0; S_.qsB[i] += +s.qB || 0; } });
  DB.purchases.forEach(s => { if (inR(s.date, f, t)) { const i = at(s.date); S_.pur[i] += s.total; S_.qpA[i] += +s.qA || 0; S_.qpB[i] += +s.qB || 0; } });
  DB.expenses.forEach(s => { if (inR(s.date, f, t)) S_.exp[at(s.date)] += +s.amt; });
  S_.rev = S_.sale.map((v, i) => v - S_.tax[i]);
  S_.profit = S_.rev.map((v, i) => v - S_.cogs[i] - S_.exp[i]);
  return S_;
}

    <div style="margin-bottom:14px"><button class="btn pri" id="s_save">Save settings</button></div>
    <div class="card" style="margin-bottom:14px"><h3>Logo</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><img src="${logoSrc()}" alt="logo" style="height:64px;background:#fff;border:1px solid var(--line);padding:4px;border-radius:6px"><label class="btn">Upload logo image<input type="file" id="logoFile" accept="image/*" hidden></label><button class="btn" id="logoReset">Use default logo</button></div><p style="color:var(--muted);font-size:12.5px;margin-bottom:0">The logo appears on the dashboard and on every invoice.</p></div>
    <div class="card"><h3>Backup &amp; data</h3><p style="margin-top:0">Your data is stored in the cloud (Firebase) and shared by all users. Download a backup file regularly${DB.lastBackup ? ` (last backup: ${new Date(DB.lastBackup).toLocaleString()})` : ' (no backup taken yet)'}.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="bk">Download backup</button><label class="btn">Restore backup<input type="file" id="rs" accept=".json" hidden></label><button class="btn" id="smp">Load sample data</button><button class="btn dng" id="clr">Erase all data</button></div></div>`;
};
mounts.settings = () => {
  const g = id => $('#' + id);
  g('logoFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { S().logo = r.result; save(); render(); toast('Logo saved'); }; r.readAsDataURL(f); };
  g('logoReset').onclick = () => { delete S().logo; save(); render(); };
  $$('.ac').forEach(i => i.onchange = () => { const a = byId(S().accounts, i.dataset.a); a[i.dataset.k] = i.dataset.k === 'opening' ? +i.value || 0 : i.value; save(); });
  $$('[data-ad]').forEach(b => b.onclick = () => { const id = b.dataset.ad; if (acctTxns().some(x => x.acct === id)) return alert('This account has transactions and cannot be deleted.'); S().accounts = S().accounts.filter(a => a.id !== id); save(); render(); });
  g('aAdd').onclick = () => { S().accounts.push({ id: 'a' + nid(), name: 'New Bank', type: 'bank', opening: 0 }); save(); render(); };
  g('s_save').onclick = () => { const s = S(); Object.assign(s, { name: g('s_name').value, address: g('s_addr').value, phone: g('s_phone').value, email: g('s_email').value, ntn: g('s_ntn').value, strn: g('s_strn').value, wA: +g('s_wA').value || 11.8, wB: +g('s_wB').value || 45.4, labelA: g('s_lA').value, labelB: g('s_lB').value, lowA: +g('s_lowA').value || 0, lowB: +g('s_lowB').value || 0 });
    s.openCost = { A: +g('s_ocA').value || 0, B: +g('s_ocB').value || 0 }; save(); toast('Settings saved'); };
  g('bk').onclick = () => { const b = new Blob([JSON.stringify(DB)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `durrani-erp-backup-${today()}.json`; a.click(); DB.lastBackup = Date.now(); save(); toast('Backup downloaded'); };
  g('rs').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.settings || !d.sales) throw 0; if (!confirm('Replace all current data with this backup?')) return; DB = d; save(); render(); toast('Backup restored'); } catch (x) { alert('This is not a valid backup file.'); } }; r.readAsText(f); };
  g('smp').onclick = () => { if (!needData() && !confirm('Sample data will be added to your current data. Continue?')) return; loadSample(); render(); toast('Sample data loaded'); };
  g('clr').onclick = () => { if (!confirm('Erase ALL data permanently? Download a backup first.')) return; if (!confirm('Really erase everything?')) return; DB = DEF(); save(); render(); };
};

/* ---- sample data ---- */
function loadSample() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; const pick = a => a[Math.floor(rnd() * a.length)];
  const st = S(); st.purchaseTax = true; st.openStock = { HOCH: { A: 40, B: 60 }, GULF: { A: 20, B: 30 } }; st.openCost = { A: 4200, B: 16160 };
  const start = parse('2026-01-01'), end = parse(today()); let rate = 4300;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const ds = iso(d); rate = Math.max(3900, Math.min(4700, rate + Math.round((rnd() - .5) * 60)));
    if (rnd() < .85) { const sup = pick(DB.suppliers), p = { date: ds, sup: sup.id, comp: pick(DB.companies.slice(0, 5)), veh: '', rate: Math.round(rate * .975), qA: rnd() < .5 ? 2 + Math.floor(rnd() * 12) : 0, qB: 28 + Math.floor(rnd() * 24), taxable: true, conc: 0, itaxPct: 0, note: '' };
      const c = calcPur(p); Object.assign(p, { gross: c.A.value + c.B.value, st: c.st, excl: c.excl, itax: 0, total: c.total }); const rec = { id: nid(), no: nextNo('purchases'), ...p }; DB.purchases.push(rec);
      DB.payments.push({ id: nid(), no: 'PAY-' + pad(rec.no), date: ds, party: sup.id, amt: Math.round(c.total * (.55 + rnd() * .35)), acct: pick(['cash', 'online', 'bank1', 'bank2']), note: '', purId: rec.id }); }
    const n = 1 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) { const cu = pick(DB.customers), p = { date: ds, cust: cu.id, comp: pick(DB.companies.slice(0, 5)), veh: pick(['AAAY567', 'BKP-221', 'KDM-904', 'ALR-318']), rate, qA: rnd() < .35 ? 2 + Math.floor(rnd() * 12) : 0, qB: 6 + Math.floor(rnd() * 20), taxable: true, conc: 0, itaxPct: 0, note: '' };
      const c = calcSale(p); Object.assign(p, { gross: c.A.value + c.B.value, st: c.st, excl: c.excl, itax: 0, total: c.total }); const rec = { id: nid(), no: nextNo('sales'), ...p }; DB.sales.push(rec);
      if (rnd() < .85) DB.receipts.push({ id: nid(), no: 'RCP-' + pad(rec.no), date: ds, party: cu.id, amt: Math.round(c.total * (.6 + rnd() * .4)), acct: pick(['cash', 'online', 'bank1', 'bank2']), note: '', saleId: rec.id }); }
    if (rnd() < .3) { const cu = pick(DB.customers); DB.receipts.push({ id: nid(), no: 'RCP-M' + nid(), date: ds, party: cu.id, amt: 50000 + Math.round(rnd() * 400000 / 1000) * 1000, acct: pick(['cash', 'online', 'bank1', 'bank2']), note: 'Payment against account' }); }
    if (rnd() < .15) { const sp = pick(DB.suppliers); DB.payments.push({ id: nid(), no: 'PAY-M' + nid(), date: ds, party: sp.id, amt: 100000 + Math.round(rnd() * 300000 / 1000) * 1000, acct: pick(['cash', 'online', 'bank1', 'bank2']), note: 'Payment against account' }); }
    if (rnd() < .5) DB.expenses.push({ id: nid(), date: ds, name: pick(['TRANSPORT', 'DOKAN', 'FUEL', 'SALARY', 'ELECTRICITY', 'REPAIR', 'MISC']), amt: 300 + Math.round(rnd() * 9000 / 50) * 50, acct: pick(['cash', 'online', 'bank1', 'bank2']), note: '' });
    if (d.getDate() === 1) DB.expenses.push({ id: nid(), date: ds, name: 'SHOP RENT', amt: 85000, acct: 'bank1', note: '' });
    if (rnd() < .08) DB.transfers.push({ id: nid(), date: ds, from: 'cash', to: pick(['bank1', 'bank2']), amt: 200000 + Math.round(rnd() * 300) * 1000, note: 'Cash deposit' });
  }
  DB.customers.forEach(c => { if (!c.address) { c.address = 'Karachi'; } });
  DB.customers[0].ntn = '1234567-8'; DB.customers[0].address = 'Plot 12, Korangi Industrial Area, Karachi';
  S().accounts[0].opening = 500000; S().accounts[2].opening = 1500000; S().accounts[3].opening = 800000; S().accounts[1].opening = 300000; save();
}

/* ================= ROUTER ================= */
function render() {
  { const sl = document.getElementById("sideLogo"); if (sl) sl.src = logoSrc(); }
  killCharts();
  const r = (location.hash.slice(1) || 'dashboard'); const route = views[r] ? r : 'dashboard';
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === route));
  $('#view').innerHTML = views[route]();
  document.title = 'Durrani ERP - ' + (NAV.find(n => n[0] === route)?.[1] || '');
  document.body.classList.remove('nav-open');
  mounts[route]?.();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.ptype) { PER.type = t.dataset.ptype; render(); }
  else if (t.dataset.pnav) { stepAnchor(+t.dataset.pnav); render(); }
  else if (t.dataset.act === 'print') printNow();
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'pAnchor' && e.target.value) { PER.anchor = e.target.value; render(); }
  else if (id === 'pFrom' || id === 'pTo') { PER[id === 'pFrom' ? 'from' : 'to'] = e.target.value || today(); render(); }
  else if (id === 'pGroup') { PER.group = e.target.value; render(); }
});
window.addEventListener('hashchange', () => { closeModal(); render(); });
window.addEventListener('beforeprint', () => Object.values(CH).forEach(x => { try { x.resize(); } catch (e) { } }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#burger').onclick = () => document.body.classList.toggle('nav-open');
window.bootApp = (d) => { load(d); buildNav(); render(); };
</script>
